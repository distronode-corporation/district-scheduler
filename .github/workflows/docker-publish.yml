name: Docker publish

# District Scheduler: builds the multi-arch (amd64 + arm64) MULTI-TENANT image from
# Dockerfile.district (PostgreSQL-only, distroless, no Litestream) and publishes it
# as ghcr.io/distronode-corporation/district-scheduler. The upstream Dockerfile is
# untouched and is not built here. Deployments pin this image BY DIGEST, never by tag.
#
# Upstream's tag scheme is kept as is, with `district` in place of `main`:
#   * PR                → build only (catches cross-arch build breaks early, e.g. an
#                         amd64-only step slipping back in). Nothing is pushed.
#   * push to dev       → push `:dev` + `:sha-<short>`. Pre-release, for deploying a
#                         branch to a real instance to test it before it reaches main.
#                         Deliberately does NOT move `:edge` or `:latest`.
#   * push to district  → push `:edge` + `:sha-<short>` (bleeding edge).
#   * push a `vX.Y.Z` tag → push `:X.Y.Z`, `:X.Y`, and `:latest`, then cut a GitHub
#                         Release. So `:latest` always tracks the newest *release*,
#                         never raw main.
#
# Pin a deployment to `:sha-<short>`, never to `:dev` or `:edge` — those move under
# you, and then nothing records which commit an instance is actually running.
#
# Every image this workflow PUSHES also gets a signed GitHub build provenance
# attestation over the digest that gets pinned, so a deployment can prove not just
# which bytes it runs but which workflow run, on which commit, produced them:
#
#   gh attestation verify oci://ghcr.io/distronode-corporation/district-scheduler@sha256:… \
#     --repo distronode-corporation/district-scheduler
#
# BuildKit already attaches its own provenance manifest to the index (the two
# `attestation-manifest` entries beside the amd64 and arm64 manifests). That one is
# unsigned and says only what BuildKit saw; this one is Sigstore-signed and is what
# `gh attestation verify` reads.
on:
  push:
    branches: [district, dev]
    tags: ['v*.*.*']
  pull_request:

# Read-only by default; the two jobs below widen it to exactly what each needs
# (packages: write to push to GHCR, contents: write to cut the Release).
permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase — GHCR tags are lowercase and ${{ github.repository }}
  # carries the repo's own casing.
  IMAGE_NAME: distronode-corporation/district-scheduler

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Both only for the provenance attestation below: id-token to get the OIDC
      # token Sigstore signs against, attestations to store the result.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computes the tag set from the git ref:
      #   district   → edge, sha-<short>
      #   dev        → dev, sha-<short>
      #   vX.Y.Z tag → X.Y.Z, X.Y, and latest (latest=auto only fires on a semver tag)
      #
      # sha- is emitted for every branch build, not just the default one, so a
      # pre-release deploy can be pinned to an immutable tag that names its commit.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=district
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (push on branch pushes and on tags)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.district
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}

      # `steps.push.outputs.digest` is buildx's `containerimage.digest`, and for a
      # multi-arch `--push` build that is the digest of the image INDEX, not of either
      # per-arch manifest. That matters: the index digest is what `crane digest
      # ghcr.io/…:sha-<short>` returns, and therefore the digest a deployment pins, so it
      # is the only one `gh attestation verify` on a pinned reference can find.
      #
      # Same condition as the GHCR login: on a pull request nothing is pushed, buildx
      # sets no `containerimage.digest`, and the action would be handed an empty subject.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}

  release:
    # Only on a version tag, and only once the image built + pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull the matching version's section out of CHANGELOG.md for the release body,
      # so the GitHub Release and the CHANGELOG stay identical. Index-based (not a `\[`
      # regex) so it's portable across awk flavours. Falls back to GitHub's
      # auto-generated notes if there's no CHANGELOG entry for the tag.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v tag="## [${version}]" '
            index($0, tag)==1 {cap=1; next}
            index($0, "## [")==1 && cap==1 {cap=0}
            substr($0,1,1)=="[" && cap==1 {exit}
            cap {print}
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      # Preinstalled gh CLI + GITHUB_TOKEN (no third-party action — keeps the
      # supply-chain surface small).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAVE_NOTES: ${{ steps.notes.outputs.have_notes }}
        run: |
          if [ "$HAVE_NOTES" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes --verify-tag
          fi
