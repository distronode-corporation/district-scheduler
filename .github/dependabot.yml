version: 2

# gomod and npm are deliberately absent here: those bumps are made upstream first and
# arrive on this fork with the sync, so a fork-side bump would edit go.mod/go.sum and
# frontend/pnpm-lock.yaml — files shared with upstream — and drift them against it.
# What is left is what the fork actually owns: its own workflow pins and its own image.
# `cooldown` holds a version bump back until the release is a week old, so a compromised
# publish that is yanked within days never reaches a PR. Security updates are not delayed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node's odd majors never become LTS, and a major moves the frontend build's
      # runtime. #24 (22 -> 25) failed the image build. Majors are taken by hand, to
      # the next even (LTS) line, with the build proven first.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
